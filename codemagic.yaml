workflows:
  android-debug:
    name: Boutique Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: apps/store_app
    environment:
      xcode: "26.4"
      flutter: "3.44.1"
      java: 17
      ndk: "28.2.13676358"
    scripts:
      - name: Install Android SDK 36
        script: /usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36"
      - name: Configure local Android paths
        script: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug --no-pub
    artifacts:
      - apps/store_app/build/app/outputs/flutter-apk/app-debug.apk
