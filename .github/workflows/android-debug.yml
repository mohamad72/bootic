name: Build Android debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build boutique APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/store_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: bootic-debug-apk
          path: apps/store_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download link
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ github.workspace }}/apps/store_app/build/app/outputs/flutter-apk/bootic-debug.apk
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK_PATH"
          RELEASE_TITLE="دانلود آزمایشی بوتیک — ${GITHUB_SHA:0:7}"
          NOTES_FILE="${RUNNER_TEMP}/bootic-release-notes.md"
          printf 'Commit: `%s`\n\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$NOTES_FILE"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest "$APK_PATH" --clobber
            git tag --force debug-latest "$GITHUB_SHA"
            git push --force origin refs/tags/debug-latest
            gh release edit debug-latest \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE"
          else
            git tag --force debug-latest "$GITHUB_SHA"
            git push --force origin refs/tags/debug-latest
            gh release create debug-latest "$APK_PATH" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi
